name: MindRecipe checks

on:
  push:
    branches: [main, 'codex/mobile-build-*', 'codex/clarity-branded-app']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest

  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: flutter
      - name: Reproduce account lifecycle failures on the 2155 source
        if: github.ref_name == 'codex/mobile-build-2156-onboarding' || github.head_ref == 'codex/mobile-build-2156-onboarding'
        working-directory: flutter
        shell: bash
        run: |
          cp lib/app_services.dart "$RUNNER_TEMP/candidate-app-services.dart"
          trap 'cp "$RUNNER_TEMP/candidate-app-services.dart" lib/app_services.dart' EXIT
          git fetch origin 3990f706ed5195fabd94034ccc3fc219ccbc3390
          git show 3990f706ed5195fabd94034ccc3fc219ccbc3390:flutter/lib/app_services.dart > lib/app_services.dart
          if flutter test --no-pub test/onboarding_state_test.dart > "$RUNNER_TEMP/onboarding-2155-baseline.log" 2>&1; then
            cat "$RUNNER_TEMP/onboarding-2155-baseline.log"
            echo 'Expected account-isolation failures were not reproduced'
            exit 1
          fi
          cat "$RUNNER_TEMP/onboarding-2155-baseline.log"
          grep -q 'Expected: false' "$RUNNER_TEMP/onboarding-2155-baseline.log"
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: flutter
      - name: Test Flutter and capture account form states
        working-directory: flutter
        run: |
          mkdir -p "$RUNNER_TEMP/clarity-account"
          MIND_RECIPE_SCREENSHOTS="$RUNNER_TEMP/clarity-account" flutter test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clarity-account-forms
          path: ${{ runner.temp }}/clarity-account/
          if-no-files-found: warn

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  clarity:
    name: Figma interface and mobile flows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clarity/package-lock.json
      - run: npm ci
        working-directory: clarity
      - run: npx playwright install --with-deps chromium
        working-directory: clarity
      - run: npm run build && npm test
        working-directory: clarity
      - run: git diff --exit-code -- flutter/assets/clarity/index.html
