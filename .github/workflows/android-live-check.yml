name: MindRecipe Android live-check APK

on:
  push:
    branches: ['codex/clarity-2159-fold2']

permissions:
  contents: read

env:
  MIND_RECIPE_STAGING_API_URL: https://staging-api.mindrecipe.142.93.201.156.sslip.io
  ORG_GRADLE_PROJECT_mindRecipeApplicationIdSuffix: .onboarding2159
  ORG_GRADLE_PROJECT_mindRecipeAppLabel: MindRecipe Candidate 2159

jobs:
  apk:
    name: Build side-by-side live-check APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clarity/package-lock.json
      - name: Build bundled Figma interface
        run: npm ci --prefix clarity && npm run build --prefix clarity

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: flutter
      - name: Build ARM64 live-check APK
        # Candidate artifacts are built only after shared regression tests pass.
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --no-pub
          flutter build apk --release --target-platform android-arm64 --no-pub --dart-define=MIND_RECIPE_API_BASE=${MIND_RECIPE_STAGING_API_URL}
        working-directory: flutter
      - run: test -s flutter/build/app/outputs/flutter-apk/app-release.apk
      - name: Record candidate identity and checksum
        shell: bash
        run: |
          apk=flutter/build/app/outputs/flutter-apk/app-release.apk
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$aapt" dump badging "$apk" > flutter/build/app/outputs/flutter-apk/package-badging.txt
          sha256sum "$apk" > flutter/build/app/outputs/flutter-apk/SHA256SUMS.txt
          python3 ci/apk_manifest.py "$apk" flutter/build/app/outputs/flutter-apk/package-badging.txt | tee flutter/build/app/outputs/flutter-apk/candidate-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: mind-recipe-android-live-check-apk
          path: |
            flutter/build/app/outputs/flutter-apk/app-release.apk
            flutter/build/app/outputs/flutter-apk/candidate-manifest.json
            flutter/build/app/outputs/flutter-apk/package-badging.txt
            flutter/build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 3
