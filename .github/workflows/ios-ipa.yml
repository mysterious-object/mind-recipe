name: MindRecipe iOS IPA (unsigned)

on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
  push:
    branches: ['codex/mobile-build-*']
    tags: ['v*']

permissions:
  contents: read

env:
  MIND_RECIPE_STAGING_API_URL: https://staging-api.mindrecipe.142.93.201.156.sslip.io

jobs:
  ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter

      - name: Build iOS release (no codesign)
        run: flutter build ios --release --no-codesign --dart-define=MIND_RECIPE_API_BASE=${MIND_RECIPE_STAGING_API_URL}
        working-directory: flutter

      - name: Build and embed pinned private-AI runtime
        run: |
          set -o pipefail
          chmod +x ci/build_llama_ios_framework.sh
          ci/build_llama_ios_framework.sh flutter/build/ios/iphoneos/Runner.app 2>&1 | tee flutter/build/ios/llama-framework-build.log

      - name: Preserve native-runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mindrecipe-ios-native-runtime-log
          path: flutter/build/ios/llama-framework-build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Verify Runner.app exists
        run: |
          test -d build/ios/iphoneos/Runner.app
          test -x build/ios/iphoneos/Runner.app/Frameworks/llama.framework/llama
          xcrun nm -gU build/ios/iphoneos/Runner.app/Frameworks/llama.framework/llama | grep -q _llama_model_load_from_file
          ls -lh build/ios/iphoneos/Runner.app/Frameworks/llama.framework/llama
        working-directory: flutter

      - name: Create unsigned .ipa
        run: |
          cd flutter
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r mind-recipe-ios-unsigned.ipa Payload
          ls -lh mind-recipe-ios-unsigned.ipa
          unzip -l mind-recipe-ios-unsigned.ipa | head -n 20

      - uses: actions/upload-artifact@v4
        with:
          name: mind-recipe-ios-unsigned-ipa
          path: flutter/mind-recipe-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
