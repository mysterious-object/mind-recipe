name: MindRecipe iOS IPA (unsigned)

on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
  push:
    branches: ['codex/mobile-build-*']
    tags: ['v*']

permissions:
  contents: read

env:
  MIND_RECIPE_STAGING_API_URL: https://staging-api.mindrecipe.142.93.201.156.sslip.io

jobs:
  ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clarity/package-lock.json
      - name: Build bundled Figma interface
        run: npm ci --prefix clarity && npm run build --prefix clarity


      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter

      - name: Run iOS native tests on an iPhone simulator
        run: bash ci/test_ios_native.sh

      - name: Preserve iOS native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindrecipe-ios-native-test-results
          path: flutter/build/ios/native-test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Build iOS release (no codesign)
        run: flutter build ios --release --no-codesign --dart-define=MIND_RECIPE_API_BASE=${MIND_RECIPE_STAGING_API_URL}
        working-directory: flutter

      - name: Create unsigned .ipa
        run: |
          cd flutter
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r mind-recipe-ios-unsigned.ipa Payload
          ls -lh mind-recipe-ios-unsigned.ipa
          python3 ../ci/check_mobile_runtime.py mind-recipe-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: mind-recipe-ios-unsigned-ipa
          path: flutter/mind-recipe-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
