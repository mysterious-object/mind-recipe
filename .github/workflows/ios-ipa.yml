name: Mind Nav iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter

      - name: Build iOS release (no codesign)
        run: flutter build ios --release --no-codesign
        working-directory: flutter

      - name: Verify Runner.app exists
        run: test -d build/ios/iphoneos/Runner.app && ls -lh build/ios/iphoneos/Runner.app
        working-directory: flutter

      - name: Create unsigned .ipa
        run: |
          cd flutter
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r mind-nav-ios-unsigned.ipa Payload
          ls -lh mind-nav-ios-unsigned.ipa
          unzip -l mind-nav-ios-unsigned.ipa | head -n 20

      - uses: actions/upload-artifact@v4
        with:
          name: mind-nav-ios-unsigned-ipa
          path: flutter/mind-nav-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
