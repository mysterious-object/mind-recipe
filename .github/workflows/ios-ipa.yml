name: Mind Recipe iOS IPA (unsigned)

on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
  push:
    branches: ['codex/mobile-build-*']
    tags: ['v*']

permissions:
  contents: read

env:
  MIND_RECIPE_STAGING_API_URL: https://staging-api.mindrecipe.142.93.201.156.sslip.io

jobs:
  ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter

      - name: Build iOS release (no codesign)
        run: flutter build ios --release --no-codesign --dart-define=MIND_RECIPE_API_BASE=${MIND_RECIPE_STAGING_API_URL}
        working-directory: flutter

      - name: Verify Runner.app exists
        run: test -d build/ios/iphoneos/Runner.app && ls -lh build/ios/iphoneos/Runner.app
        working-directory: flutter

      - name: Create unsigned .ipa
        run: |
          cd flutter
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r mind-recipe-ios-unsigned.ipa Payload
          ls -lh mind-recipe-ios-unsigned.ipa
          unzip -l mind-recipe-ios-unsigned.ipa | head -n 20

      - uses: actions/upload-artifact@v4
        with:
          name: mind-recipe-ios-unsigned-ipa
          path: flutter/mind-recipe-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
