apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
  namespace: mind-recipe-staging
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: mind-recipe-staging
spec:
  provider:
    vault:
      server: http://vault.vault-system.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: mind-recipe-staging-reader
          serviceAccountRef:
            name: vault-reader
            audiences: [vault]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mind-recipe-runtime
  namespace: mind-recipe-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: mind-recipe-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MIND_RECIPE_AUTH_SECRET
      remoteRef:
        key: projects/mind-recipe-staging/mind-recipe-runtime
        property: MIND_RECIPE_AUTH_SECRET
