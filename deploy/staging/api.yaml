apiVersion: v1
kind: Namespace
metadata:
  name: mind-recipe-staging
  labels:
    app.kubernetes.io/name: mind-recipe
    app.kubernetes.io/part-of: mind-recipe
---
apiVersion: v1
kind: Service
metadata:
  name: mind-recipe-api
  namespace: mind-recipe-staging
spec:
  selector:
    app: mind-recipe-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mind-recipe-api
  namespace: mind-recipe-staging
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mind-recipe-api
  template:
    metadata:
      labels:
        app: mind-recipe-api
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      # The previous deployment referenced a node-local image that vanished
      # after a node restart, leaving authentication behind an ImagePullBackOff.
      # Prepare the small Python dependency layer from pinned public packages so
      # a fresh node can always recreate staging without a private registry.
      initContainers:
        - name: prepare-python-dependencies
          image: python:3.12-slim@sha256:2c941e860699f878900b0edc2403613c234d4b32eda3cc9fa7036991a2a63c4a
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "pip", "install"]
          args:
            - --disable-pip-version-check
            - --no-cache-dir
            - --target
            - /opt/python-site
            - fastapi==0.141.1
            - pydantic==2.13.5
            - uvicorn[standard]==0.52.4
            - httpx==0.28.1
            - psycopg[binary]==3.3.5
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: python-site
              mountPath: /opt/python-site
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      containers:
        - name: api
          image: python:3.12-slim@sha256:2c941e860699f878900b0edc2403613c234d4b32eda3cc9fa7036991a2a63c4a
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn"]
          args: ["app.main:app", "--host", "0.0.0.0", "--port", "8080"]
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: MIND_RECIPE_ENV
              value: development
            - name: MIND_RECIPE_DB_PATH
              value: /data/mind-recipe-staging.sqlite3
            - name: PYTHONPATH
              value: /opt/python-site:/app
          envFrom:
            - secretRef:
                name: mind-recipe-runtime
                optional: true
          volumeMounts:
            - name: source
              mountPath: /app/app
              readOnly: true
            - name: python-site
              mountPath: /opt/python-site
              readOnly: true
            - name: staging-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests: {cpu: 50m, memory: 20Mi}
            limits: {cpu: "500m", memory: 384Mi}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: source
          configMap:
            name: mind-recipe-api-source
        - name: python-site
          emptyDir: {}
        - name: staging-data
          persistentVolumeClaim:
            claimName: mind-recipe-staging-data
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mind-recipe-api
  namespace: mind-recipe-staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [staging-api.mindrecipe.142.93.201.156.sslip.io]
      secretName: mind-recipe-api-tls
  rules:
    - host: staging-api.mindrecipe.142.93.201.156.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mind-recipe-api
                port: {name: http}
