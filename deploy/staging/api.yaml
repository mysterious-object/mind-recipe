apiVersion: v1
kind: Namespace
metadata:
  name: mind-recipe-staging
  labels:
    app.kubernetes.io/name: mind-recipe
    app.kubernetes.io/part-of: mind-recipe
---
apiVersion: v1
kind: Service
metadata:
  name: mind-recipe-api
  namespace: mind-recipe-staging
spec:
  selector:
    app: mind-recipe-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mind-recipe-api
  namespace: mind-recipe-staging
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mind-recipe-api
  template:
    metadata:
      labels:
        app: mind-recipe-api
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: docker.io/library/mind-nav-api:staging-20260822
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args: ["uvicorn app.main:app --host 0.0.0.0 --port 8080"]
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: MIND_RECIPE_ENV
              value: development
            - name: MIND_RECIPE_DB_PATH
              value: /data/mind-recipe-staging.sqlite3
            - name: PYTHONPATH
              value: /tmp/site:/app
          envFrom:
            - secretRef:
                name: mind-recipe-runtime
                optional: true
          volumeMounts:
            - name: source
              mountPath: /app/app
              readOnly: true
            - name: staging-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests: {cpu: 50m, memory: 20Mi}
            limits: {cpu: "500m", memory: 384Mi}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: source
          configMap:
            name: mind-recipe-api-source
        - name: staging-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mind-recipe-api
  namespace: mind-recipe-staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [staging-api.mindrecipe.142.93.201.156.sslip.io]
      secretName: mind-recipe-api-tls
  rules:
    - host: staging-api.mindrecipe.142.93.201.156.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mind-recipe-api
                port: {name: http}
