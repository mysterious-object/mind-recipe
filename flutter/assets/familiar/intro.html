<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:">
<style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#060912}canvas{display:block}</style></head>
<body><script type="module">
import * as THREE from './three.module.min.js';
const params=new URLSearchParams(location.search); let variant=Number(params.get('v')||0)%6;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100); camera.position.z=4.4;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.setSize(innerWidth,innerHeight); renderer.setClearColor(0x060912); document.body.append(renderer.domElement);
const geometry=new THREE.IcosahedronGeometry(1.15,6);
const colors=[0x21e6c1,0x57a7ff,0xb96cff,0xff8c42,0x46e08a,0x40d4ff];
const material=new THREE.MeshPhysicalMaterial({color:colors[variant],roughness:.22,metalness:.18,transmission:.18,clearcoat:1,wireframe:variant===4});
const orb=new THREE.Mesh(geometry,material); scene.add(orb);
scene.add(new THREE.AmbientLight(0x6f8cff,1.8)); const key=new THREE.PointLight(colors[(variant+2)%6],18); key.position.set(2.5,2.2,3); scene.add(key);
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.65,.012,12,180),new THREE.MeshBasicMaterial({color:colors[(variant+1)%6],transparent:true,opacity:.55})); ring.rotation.x=1.15; scene.add(ring);
const clock=new THREE.Clock(); let paused=false;
function animate(){if(paused)return;requestAnimationFrame(animate);const t=clock.getElapsedTime();orb.rotation.y=t*(.18+variant*.025);orb.rotation.x=Math.sin(t*.35)*.16;const p=1+Math.sin(t*1.4+variant)*.035;orb.scale.setScalar(p);ring.rotation.z=t*(variant%2?.19:-.16);renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
window.setIntroPaused=v=>{paused=!!v;if(!paused)animate()}; animate();
window.setIntroVariant=v=>{variant=Number(v)%6;material.color.setHex(colors[variant]);key.color.setHex(colors[(variant+2)%6]);ring.material.color.setHex(colors[(variant+1)%6]);material.wireframe=variant===4;material.needsUpdate=true};
try{IntroBridge.postMessage('ready')}catch(e){}
</script></body></html>
