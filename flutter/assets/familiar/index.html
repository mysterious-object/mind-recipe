<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; media-src 'none'; frame-src 'none'; object-src 'none';">
  <style>
    html,body,#familiar{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
    canvas{display:block;touch-action:none}
  </style>
</head>
<body>
<div id="familiar" role="img" aria-label="Your evolving Pulse familiar"></div>
<script type="module">
import * as THREE from './three.module.min.js';

const host = document.getElementById('familiar');
let renderer, scene, camera, familiar, material, halo, particles;
let paused = false, reduceMotion = false, state = null, last = 0;

function bridge(message) {
  if (window.FamiliarBridge && window.FamiliarBridge.postMessage) {
    window.FamiliarBridge.postMessage(message);
  }
}

function seeded(seed) {
  let value = seed >>> 0;
  return () => ((value = Math.imul(1664525, value) + 1013904223 >>> 0) / 4294967296);
}

function makeGeometry(detail) {
  return new THREE.IcosahedronGeometry(1, Math.max(3, Math.min(6, detail)));
}

function init() {
  try {
    renderer = new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'low-power'});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setSize(host.clientWidth, host.clientHeight, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    host.appendChild(renderer.domElement);
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(38, host.clientWidth / host.clientHeight, 0.1, 30);
    camera.position.z = 4.2;
    const light = new THREE.PointLight(0xffffff, 2.2, 12); light.position.set(2,2,4); scene.add(light);
    scene.add(new THREE.AmbientLight(0x7ce8ff, 0.8));
    window.addEventListener('resize', resize);
    renderer.domElement.addEventListener('webglcontextlost', e => {e.preventDefault(); bridge('context_lost');});
    renderer.domElement.addEventListener('webglcontextrestored', () => {rebuild(); bridge('ready');});
    bridge('ready');
    renderer.setAnimationLoop(render);
  } catch (_) { bridge('webgl_error'); }
}

function rebuild() {
  if (!renderer || !state) return;
  if (familiar) scene.remove(familiar);
  if (halo) scene.remove(halo);
  if (particles) scene.remove(particles);
  const rnd = seeded(state.seed);
  const hue = ((state.hue % 360) + 360) % 360;
  const primary = new THREE.Color().setHSL(hue / 360, .76, .54);
  const secondary = new THREE.Color().setHSL(((hue + 72 + rnd()*34) % 360) / 360, .82, .58);
  material = new THREE.ShaderMaterial({
    transparent:true,
    uniforms:{uTime:{value:0},uPrimary:{value:primary},uSecondary:{value:secondary},uEnergy:{value:state.activation},uForm:{value:state.form}},
    vertexShader:`uniform float uTime;uniform float uEnergy;uniform float uForm;varying vec3 vNormal;varying float vWave;
      void main(){vNormal=normalize(normalMatrix*normal);float a=position.x*3.7+uTime*.32;float b=position.y*4.1-uTime*.24;float c=position.z*3.3+uTime*.19;
      float wave=(sin(a)+sin(b)+sin(c))/3.;float d=.08+uForm*.10+uEnergy*.035;vec3 p=position+normal*wave*d;vWave=wave;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
    fragmentShader:`uniform vec3 uPrimary;uniform vec3 uSecondary;varying vec3 vNormal;varying float vWave;
      void main(){float rim=pow(1.-abs(vNormal.z),2.2);vec3 color=mix(uPrimary,uSecondary,vWave*.5+.5);color+=rim*.42;gl_FragColor=vec4(color,.91);}`
  });
  familiar = new THREE.Mesh(makeGeometry(3 + Math.floor(state.complexity * 3)), material);
  familiar.rotation.set(rnd()*2, rnd()*2, rnd()*2);
  familiar.scale.setScalar(.88 + state.growth*.22);
  scene.add(familiar);
  const haloMaterial = new THREE.MeshBasicMaterial({color:secondary,transparent:true,opacity:.22,wireframe:true});
  halo = new THREE.Mesh(new THREE.TorusKnotGeometry(1.34 + state.growth*.12,.012 + state.complexity*.01,90,8,2+Math.floor(rnd()*2),3),haloMaterial);
  scene.add(halo);
  const count = 18 + Math.floor(state.complexity*34);
  const points = new Float32Array(count*3);
  for(let i=0;i<count;i++){const radius=1.55+rnd()*.65;const theta=rnd()*Math.PI*2;const phi=Math.acos(2*rnd()-1);points[i*3]=radius*Math.sin(phi)*Math.cos(theta);points[i*3+1]=radius*Math.sin(phi)*Math.sin(theta);points[i*3+2]=radius*Math.cos(phi);}
  const geometry = new THREE.BufferGeometry(); geometry.setAttribute('position',new THREE.BufferAttribute(points,3));
  particles = new THREE.Points(geometry,new THREE.PointsMaterial({color:primary,size:.025+state.complexity*.018,transparent:true,opacity:.72})); scene.add(particles);
}

window.setFamiliarState = function(next) {
  if (!next || typeof next.seed !== 'number') return;
  state = next; reduceMotion = !!next.reduceMotion; rebuild();
};
window.setFamiliarPaused = function(value) { paused = !!value; };

function resize(){if(!renderer)return;const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();renderer.setSize(w,h,false);}
function render(ms){if(!renderer||!state||paused)return;const t=ms*.001;const dt=Math.min(.05,(ms-last)*.001);last=ms;
  if(material)material.uniforms.uTime.value=t;
  const speed=reduceMotion?.05:.10+state.activation*.13;
  familiar.rotation.y+=dt*speed; familiar.rotation.x+=dt*speed*.43;
  halo.rotation.x-=dt*speed*.34; halo.rotation.y+=dt*speed*.58;
  particles.rotation.y-=dt*speed*.16;
  const breathe=1+Math.sin(t*(.55+state.activation*.5))*(reduceMotion?.008:.025+state.activation*.018);
  familiar.scale.setScalar((.88+state.growth*.22)*breathe);
  renderer.render(scene,camera);
}
document.addEventListener('visibilitychange',()=>window.setFamiliarPaused(document.hidden));
init();
</script>
</body>
</html>
